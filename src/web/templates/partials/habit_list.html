<div id="habit-list">
    {% if not habits %}
        <p style="color: var(--text-secondary); text-align: center; margin-top: 40px;">No habits registered yet. Create your first habit above!</p>
    {% endif %}

    {% for habit in habits %}
        <div class="habit-card {% if habit.completed_today %}completed{% endif %}">
            <div class="habit-info">
                <h3>{{ habit.name }}</h3>
                {% if habit.description %}
                    <p>{{ habit.description }}</p>
                {% endif %}
                <span class="streak-badge">🔥 {{ habit.streak }} day streak</span>
            </div>
            <div>
                {% if habit.completed_today %}
                    <button class="btn-done" disabled>✓ Completed Today</button>
                {% else %}
                    <button class="btn-complete"
                            hx-post="/habits/{{ habit.id }}/complete"
                            hx-target="#habit-list"
                            hx-swap="outerHTML">
                        Check In
                    </button>
                {% endif %}
            </div>
        </div>
    {% endfor %}
</div>
