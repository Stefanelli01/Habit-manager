<div id="habit-list" class="habit-grid">
    {% if not habits %}
        <p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; margin-top: 20px;">
            No habits registered yet. Create your first habit above!
        </p>
    {% endif %}

    {% for habit in habits %}
        <div class="habit-card">
            <div>
                <h4 style="margin: 0;">{{ habit.name }}</h4>
                {% if habit.description %}
                    <p style="margin: 4px 0; font-size: 0.85rem; color: var(--text-muted);">{{ habit.description }}</p>
                {% endif %}
                <span style="font-size: 0.75rem; color: var(--accent-purple); font-weight: 600;">🔥 {{ habit.streak }} day streak</span>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                {% if habit.completed_today %}
                    <button class="btn-check done" disabled>✓</button>
                {% else %}
                    <button class="btn-check"
                            hx-post="/habits/{{ habit.id }}/complete"
                            hx-target="#habit-list"
                            hx-swap="outerHTML">
                        ✓
                    </button>
                {% endif %}

                <button class="btn-del"
                        hx-delete="/habits/{{ habit.id }}"
                        hx-target="#habit-list"
                        hx-swap="outerHTML"
                        hx-confirm="Delete this habit?">
                    ✕
                </button>
            </div>
        </div>
    {% endfor %}
</div>
